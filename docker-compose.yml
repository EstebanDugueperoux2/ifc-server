# IFC-Lite Server - Production Configuration
# Start with: docker compose up -d

services:
  ifc-server:
    image: ghcr.io/ltplus-ag/ifc-lite-server:latest
    container_name: ifc-server-server
    ports:
      - "${PORT:-3001}:8080"
    volumes:
      - ifc-cache:/app/cache
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-500}
      - REQUEST_TIMEOUT_SECS=${REQUEST_TIMEOUT_SECS:-300}
      - WORKER_THREADS=${WORKER_THREADS:-4}
      - INITIAL_BATCH_SIZE=${INITIAL_BATCH_SIZE:-100}
      - MAX_BATCH_SIZE=${MAX_BATCH_SIZE:-1000}
      - CACHE_MAX_AGE_DAYS=${CACHE_MAX_AGE_DAYS:-7}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # IFC model storage (save / list / download / delete .ifc files)
  model-store:
    build: ./model-store
    container_name: ifc-server-model-store
    ports:
      - "${STORE_PORT:-3002}:8081"
    volumes:
      - ifc-models:/data
    environment:
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-500}
      # Optional bearer token required on every /api/v1/models request
      - STORE_API_TOKEN=${STORE_API_TOKEN:-}
      # Comma-separated origins allowed to call the store directly from a browser
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    restart: unless-stopped

volumes:
  ifc-cache:
    name: ifc-server-cache
  ifc-models:
    name: ifc-server-models
