# IFC-Lite Server - Production Configuration
# Start with: docker compose up -d
#
# =============================================================================
# PARQUET-WASM / APACHE-ARROW SUPPORT
# =============================================================================
# For 15x smaller payloads, use Parquet format:
# 1. The ifc-server supports Parquet by default via /api/v1/parse/parquet endpoints
# 2. The ifc-viewer-webapp includes apache-arrow and parquet-wasm dependencies
# 3. CORS headers are configured to allow browser WASM module loading
# 4. For production: Build ifc-viewer-webapp with `npm run build`
#    This bundles the WASM modules for the browser
# 5. For development: Use Vite dev server (port 5173) which proxies to backend

services:
  ifc-server:
    image: ghcr.io/ltplus-ag/ifc-lite-server:latest
    container_name: ifc-server-server
    ports:
      - "${PORT:-3001}:8080"
    volumes:
      - ifc-cache:/app/cache
    environment:
      # Parquet format is enabled by default in the ifc-lite-server image
      # Use /api/v1/parse/parquet or /api/v1/parse/parquet-stream endpoints for 15x smaller payloads
      # Requires apache-arrow and parquet-wasm in the client (included in ifc-viewer-webapp dependencies)
      # For browser WASM support, CORS headers must be configured:
      - RUST_LOG=${RUST_LOG:-info}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - CORS_ORIGINS=*
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-500}
      - REQUEST_TIMEOUT_SECS=${REQUEST_TIMEOUT_SECS:-300}
      - WORKER_THREADS=${WORKER_THREADS:-4}
      - INITIAL_BATCH_SIZE=${INITIAL_BATCH_SIZE:-100}
      - MAX_BATCH_SIZE=${MAX_BATCH_SIZE:-1000}
      - CACHE_MAX_AGE_DAYS=${CACHE_MAX_AGE_DAYS:-7}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # AI assistant: tool-use loop + embedded @ifc-lite/mcp server
  # Supports multiple AI providers: anthropic, openai, mistral, google
  # Note: For parquet-wasm/apache-arrow support, ensure ifc-viewer-webapp is built
  # with npm dependencies (apache-arrow, parquet-wasm) and Vite handles WASM modules
  assistant:
    build: ./assistant
    container_name: ifc-server-assistant
    ports:
      # Loopback only by default: every request spends API credits.
      - "127.0.0.1:${ASSISTANT_PORT:-3003}:8082"
    environment:
      # AI Provider Selection
      - ASSISTANT_PROVIDER=${ASSISTANT_PROVIDER:-openai}
      
      # # Anthropic Configuration
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      # - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      # - ANTHROPIC_TIMEOUT_SEC=${ANTHROPIC_TIMEOUT_SEC:-120}
      
      # OpenAI Configuration (Default Provider)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4}
      - OPENAI_TIMEOUT_SEC=${OPENAI_TIMEOUT_SEC:-120}
      
      # # Mistral Configuration
      # - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      # - MISTRAL_BASE_URL=${MISTRAL_BASE_URL:-}
      # - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral-large}
      # - MISTRAL_TIMEOUT_SEC=${MISTRAL_TIMEOUT_SEC:-120}
      
      # # Google (Gemini) Configuration
      # - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      # - GOOGLE_BASE_URL=${GOOGLE_BASE_URL:-}
      # - GOOGLE_MODEL=${GOOGLE_MODEL:-gemini-pro}
      # - GOOGLE_TIMEOUT_SEC=${GOOGLE_TIMEOUT_SEC:-120}
      
      # Common Assistant Settings
      - ASSISTANT_API_TOKEN=${ASSISTANT_API_TOKEN:-}
      - ASSISTANT_READ_ONLY=${ASSISTANT_READ_ONLY:-false}
      - MAX_TOKENS=${MAX_TOKENS:-4096}
      - MAX_STEPS=${MAX_STEPS:-12}
      - MAX_CONVERSATIONS=${MAX_CONVERSATIONS:-50}
      - CONVERSATION_TTL_MIN=${CONVERSATION_TTL_MIN:-30}
      - MAX_MESSAGE_CHARS=${MAX_MESSAGE_CHARS:-4000}
      
      # CORS origins for browser access to assistant API (Vite dev server by default)
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - CORS_ORIGINS=*
    restart: unless-stopped

volumes:
  ifc-cache:
    name: ifc-server-cache
